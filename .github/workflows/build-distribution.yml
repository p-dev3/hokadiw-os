name: Build HOKADIW Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: hokadiw-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout HOKADIW build overlay
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify fast APK overlay
        run: |
          command -v curl git java python3 unzip
          bash -n scripts/build-apk-fast.sh
          python3 -m py_compile scripts/patch-app.py

      - name: Build installable HOKADIW APK
        run: |
          set -o pipefail
          bash scripts/build-apk-fast.sh 2>&1 | tee build-app.log

      - name: Assemble distribution artifact
        run: |
          set -euo pipefail
          source config.env

          # Validate the APK exists before proceeding.
          if [ ! -d "dist/app" ]; then
            echo "ERROR: dist/app not found. Build app step may have failed." >&2
            exit 1
          fi
          test -n "$(find dist/app -maxdepth 1 -type f -name '*.apk' -print -quit)"

          # Clean and prepare artifact directory
          rm -rf ./artifact
          mkdir -p ./artifact

          # Copy with explicit paths and error checking
          cp -a dist/app ./artifact/apk

          # Write BUILD_INFO.txt
          {
            echo "HOKADIW Terminal v${HOKADIW_VERSION}"
            echo "Application ID: ${HOKADIW_PACKAGE}"
            echo "PREFIX: /data/data/${HOKADIW_PACKAGE}/files/usr"
            echo "Architecture: ${HOKADIW_ARCH} / ${HOKADIW_ANDROID_ABI}"
            echo "termux-app: ${TERMUX_APP_REF}"
            echo "Bootstrap: official apt-android-7 ARM64 with HOKADIW prefix rewrite"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Built at: $(date -u +%FT%TZ)"
          } > ./artifact/BUILD_INFO.txt

      - name: Upload HOKADIW distribution
        uses: actions/upload-artifact@v6
        with:
          name: hokadiw-distribution-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hokadiw-build-diagnostics
          path: |
            build-app.log
            .work/termux-app/HOKADIW_APP_IDENTITY.txt
          if-no-files-found: ignore
          retention-days: 7
